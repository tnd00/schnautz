# Hält Abhängigkeiten und Actions aktuell, gebündelt in einem Pull Request pro Monat.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ['*']
    ignore:
      # TypeScript 7 erst, wenn typescript-eslint es unterstützt
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Typen passend zur Node-Version aus .nvmrc
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
