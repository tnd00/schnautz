# Baut die Seite bei jedem Push auf main und veröffentlicht sie auf GitHub Pages.
# Voraussetzung: Settings, Pages, Source steht auf "GitHub Actions".
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Nie zwei Veröffentlichungen gleichzeitig, eine laufende wird aber nicht abgebrochen
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # build prüft auch die Typen
      - run: npm run build
      # Größengrenze für Einstiegsstück und CSS (gzip), siehe tests/size.mjs
      - run: node tests/size.mjs dist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
